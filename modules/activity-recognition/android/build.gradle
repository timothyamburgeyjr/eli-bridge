apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.activityrecognition'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.activityrecognition"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }
}

dependencies {
  // Google Play Services Location bundles the Activity Recognition API
  // (ActivityRecognitionClient lives in this artifact). 21.3.0 matches the
  // Play Services baseline for SDK 55 — avoid bumping without testing,
  // transitive drift here is what the [[project_voice_onnx_runtime]] memory
  // is warning about.
  implementation 'com.google.android.gms:play-services-location:21.3.0'
}
